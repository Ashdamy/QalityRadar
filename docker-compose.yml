services:
  postgres:
    image: postgres:16-alpine
    # Monitorizacion de consultas: deja en el log de Postgres las que tardan
    # mas de medio segundo y las que se quedan esperando un bloqueo, que es lo
    # primero que hay que mirar cuando la aplicacion se vuelve lenta.
    # log_parameter_max_length=0: el texto de la consulta si, los valores no,
    # porque entre ellos van correos y hashes que no deben acabar en un log.
    command:
      - postgres
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    environment:
      POSTGRES_USER: qalitiradar
      POSTGRES_PASSWORD: qalitiradar_dev
      POSTGRES_DB: qalitiradar
    # 5433 en el host: el 5432 lo ocupa un PostgreSQL nativo de Windows
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qalitiradar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Bandeja falsa para desarrollo: atrapa los correos de verificacion en vez de
  # mandarlos. Se leen en http://localhost:8025. En produccion no existe; ahi
  # SMTP_HOST apunta a un proveedor real.
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./backend:/app"]

  # El worker NO se levanta con `docker compose up`: corre en el host para
  # poder lanzar los contenedores de analisis contra el demonio Docker local
  # sin tener que montar /var/run/docker.sock dentro de un contenedor (via
  # clasica de escalada a root del host). Ver docs/ARCHITECTURE.md §4.1.
  # En desarrollo:  celery -A app.worker worker --loglevel=info
  # Este servicio queda solo para inspeccion puntual:
  #   docker compose --profile manual up worker
  worker:
    build: ./backend
    profiles: ["manual"]
    command: celery -A app.worker worker --loglevel=info
    env_file: ./backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./backend:/app"]

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pgdata:
