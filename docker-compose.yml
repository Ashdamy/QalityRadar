services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qalitiradar
      POSTGRES_PASSWORD: qalitiradar_dev
      POSTGRES_DB: qalitiradar
    # 5433 en el host: el 5432 lo ocupa un PostgreSQL nativo de Windows
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qalitiradar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./backend:/app"]

  # El worker NO se levanta con `docker compose up`: corre en el host para
  # poder lanzar los contenedores de analisis contra el demonio Docker local
  # sin tener que montar /var/run/docker.sock dentro de un contenedor (via
  # clasica de escalada a root del host). Ver docs/ARCHITECTURE.md §4.1.
  # En desarrollo:  celery -A app.worker worker --loglevel=info
  # Este servicio queda solo para inspeccion puntual:
  #   docker compose --profile manual up worker
  worker:
    build: ./backend
    profiles: ["manual"]
    command: celery -A app.worker worker --loglevel=info
    env_file: ./backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./backend:/app"]

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pgdata:
